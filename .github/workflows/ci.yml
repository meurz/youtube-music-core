name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- --help
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Build .NET host example
        if: runner.os == 'Windows'
        run: dotnet build examples/dotnet --configuration Release
      - name: Build Windows release candidate
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Exercise .NET native cancellation and lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet build examples/dotnet-smoke --configuration Release
          Copy-Item target/release/youtube_music_core.dll examples/dotnet-smoke/bin/Release/net8.0/
          dotnet examples/dotnet-smoke/bin/Release/net8.0/InteropSmoke.dll
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-release-candidate
          path: |
            target/release/ytmusic.exe
            target/release/youtube_music_core.dll
