[package]
name = "youtube-music-core"
version = "0.10.0"
edition = "2021"
rust-version = "1.93"
description = "Native Rust YouTube Music protocol library, JSON CLI, and C ABI"
license = "GPL-3.0-only"
repository = "https://github.com/meurz/youtube-music-core"

[workspace]
members = ["vendor/rustypipe"]
default-members = ["."]
resolver = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ytmusic"
path = "src/main.rs"

[dependencies]
rustypipe = { path = "vendor/rustypipe", default-features = false, features = ["rustls-tls-webpki-roots", "userdata"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
httpdate = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }

[profile.release]
lto = "thin"
strip = true

# Keep embedded player parsing practical in development builds as well.
[profile.dev.package.rquickjs-sys]
opt-level = 2
